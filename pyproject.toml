[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storyland-ai"
version = "0.1.0"
description = "Literary travel itinerary generator using Google ADK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "google-adk[eval]>=1.33.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.20.0",
    "tenacity>=8.2.3",
    "structlog>=23.2.0",
    "python-dateutil>=2.8.2",
    "async-timeout>=4.0.0",
    "langfuse>=4.0.0,<5.0.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "pytest-vcr>=1.0.2",
    "vcrpy>=6.0.0",
    "responses>=0.25.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: async tests",
    "slow: slow-running tests",
    "integration: integration tests requiring external APIs",
    "real_api: tests that hit real APIs (quota usage)",
]
addopts = "-v --tb=short --strict-markers -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["agents", "models", "tools", "services", "api", "core"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools]
packages = ["agents", "models", "common", "services", "tools", "plugins", "evaluation", "api", "core"]
