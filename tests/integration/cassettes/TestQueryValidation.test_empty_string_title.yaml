        considered one of Shakespeare's problem plays, the work examines the ideas
        of sin and justice. Duke Vincentio turns Vienna's rule over to the corrupt
        Angelo, who sentences Claudio to death for having impregnated a woman before
        marriage. His sister Isabella, a novice nun, pleads for her brother's life,
        only to be told that he will be spared if she agrees to relinquish her virginity
        to Angelo. Life of William Shakespeare is a biography of William Shakespeare
        by the eminent critic Sidney Lee. This book was one of the first major biographies
        of the Bard of Avon. It was published in 1898, based on the article contributed
        to the Dictionary of National Biography. William Shakespeare (1564 \u2013
        1616) was an English poet and playwright, widely regarded as the greatest
        writer in the English language and the world's pre-eminent dramatist. He is
        often called England's national poet and the \\\"Bard of Avon\\\". His extant
        works, including some collaborations, consist of about 38 plays, 154 sonnets,
        two long narrative poems, and a few other verses, the authorship of some of
        which is uncertain. Sir Sidney Lee (1859 \u2013 1926) was an English biographer
