      on the criteria below:\n\n**1. BOOK_RELEVANCE (1-5)**\nEvaluate if the travel
      itinerary locations are directly connected to the book''s settings, themes,
      characters, or author. Each suggested place should have a clear and meaningful
      connection to the literary work.\n\nScore 1-5 where:\n5 = All locations strongly
      connected to book\n4 = Most locations clearly relevant\n3 = Some locations relevant,
      some generic\n2 = Few relevant locations\n1 = No clear connection to book\n\n**2.
      PREFERENCE_ADHERENCE (1-5)**\nEvaluate if the travel recommendations respect
      the user''s stated preferences including budget level, travel pace, accessibility
      needs, and interest in museums. The response should acknowledge and adapt to
      these preferences.\n\nScore 1-5 where:\n5 = Perfectly aligned with all preferences\n4
      = Respects most preferences well\n3 = Acknowledges some preferences\n2 = Ignores
      most preferences\n1 = No consideration of preferences\n\n**3. COMPLETENESS (1-5)**\nEvaluate
      if the response includes a comprehensive itinerary with cities, landmarks, and
      author-related sites. The itinerary should provide enough detail for the traveler
      to plan their trip.\n\nScore 1-5 where:\n5 = Comprehensive with all components\n4
      = Good coverage of main elements\n3 = Basic itinerary, missing some details\n2
      = Minimal information\n1 = Incomplete or vague response\n\n**4. ACTIONABILITY
      (1-5)**\nEvaluate if the itinerary is practical and actionable with specific
      places, suggested times of day to visit, and logistical notes. The traveler
      should be able to use this information to actually plan their trip.\n\nScore
      1-5 where:\n5 = Highly detailed and actionable\n4 = Good practical details\n3
      = Some actionable information\n2 = Vague suggestions\n1 = No practical details\n\n**5.
      GEOGRAPHICAL_ACCURACY (1-5)**\nEvaluate if the locations mentioned are real
      places that can be visited. Cities and landmarks should be correctly associated
      with their countries. The geographical information should be accurate.\n\nScore
      1-5 where:\n5 = All locations accurate and real\n4 = Minor geographical details
      off\n3 = Some questionable locations\n2 = Multiple inaccuracies\n1 = Fictional
      or incorrect locations\n\n**6. ENGAGEMENT (1-5)**\nEvaluate if the summary and
      descriptions are engaging and evoke the spirit of the book. The language should
      capture the literary connection and make the trip feel like a meaningful journey.\n\nScore
      1-5 where:\n5 = Highly engaging, captures book''s spirit\n4 = Good descriptions,
      engaging tone\n3 = Adequate but generic descriptions\n2 = Dry or uninspiring\n1
      = No literary connection in writing\n\n---\n\n**INPUT PROMPT**:\nPlan a trip
      based on Pride and Prejudice\n\n**USER PREFERENCES**:\nNo preferences specified\n\n**GENERATED
