name: pip-audit

# MYS-440 scope 2: CVE gate on the PROD lock (what the image ships) — the
# same gate storyland-services runs in its test workflow. Accepted or
# unfixable CVEs are ignored inline WITH justification + a ticket, and the
# ignore is removed the moment a fixed version exists and the lock moves
# past it.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit shipped dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit --strict --require-hashes -r requirements.lock \
            --ignore-vuln PYSEC-2026-2447 \
            --ignore-vuln CVE-2026-114603 \
            --ignore-vuln CVE-2026-126360
            # CVE-2026-114603 (opentelemetry-api 1.41.1, GHSA-xcq7-p3pf-p88h):
            # O(N^2) regex in TraceState.from_header, reached only when a server
            # extracts an inbound W3C tracestate header. We never do: no
            # propagate.extract / ASGI instrumentation in our code, and ADK's
            # only extract() (telemetry/_agent_engine.py) runs under ADK's own
            # get_fast_api_app, which we don't use, and passes traceparent only.
            # Accepted risk, tracked on storyland-ai-private#59.
            # CVE-2026-126360 (opentelemetry-api 1.41.1, GHSA-mf5v-w3w3-f6cg):
            # ReDoS in TraceContextTextMapPropagator.extract() on a crafted
            # traceparent. Same reach as above: the only extract() call in the
            # installed lock is ADK's get_propagated_context, called only from
            # google/adk/cli/fast_api.py (get_fast_api_app), which we never
            # import; nothing in our code or in langfuse/sentry_sdk extracts an
            # inbound traceparent, and the service is internal behind the
            # gateway. Accepted risk, tracked on storyland-ai-private#79.
            # Both fixes (1.45.1, 1.45.2) are above the otel cap of the ADK line
            # we hold (<2.13 caps opentelemetry-api at 1.42.1). google-adk 2.14.1
            # admits 1.45.2, so remove BOTH ignores with the bump past the <2.13
            # hold (storyland-ai-private#60: Ops Watch's call_llm span reads).
            # diskcache 5.6.3 pickle deserialization (CVE-2025-69872 class):
            # exploitable only with WRITE access to the cache directory on
            # the box — an attacker with that access has already won. NO
            # fixed release exists. Accepted risk, tracked on MYS-440/MYS-402
            # (lockfile PR2); drop this ignore when a fixed version ships.
