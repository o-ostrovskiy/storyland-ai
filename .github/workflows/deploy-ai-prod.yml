name: Deploy AI (prod)

# G5-gated production release for the AI service (storyland-ai).
#
# SELF-CONTAINED on purpose: storyland-ai is a PUBLIC repo, and a public repo
# cannot call a reusable workflow that lives in a PRIVATE repo
# (storyland-infrastructure). So unlike the frontend/backend callers, this
# workflow inlines the deploy steps instead of `uses:`-ing
# infra/.github/workflows/deploy-service.yml. The deploy logic mirrors that
# reusable workflow exactly for service=storyland-ai — keep the two in sync.
#
# IMAGE-BASED DEPLOY (infra #38): the image is built ON THE RUNNER, the
# immutable :<short-sha> tag is pushed to GHCR (ghcr.io/o-ostrovskiy/
# storyland-ai), the stage gate boots the full stack from it, and only then
# does :prod move (registry-side) — a gate failure leaves the box and the
# registry untouched. Then the box does `docker pull :prod` +
# `compose up -d --no-deps storyland-ai`. The box never builds on this path
# (no build CPU/memory contention with live traffic), source is no longer
# rsynced by this workflow, and rollback is a REGISTRY-side re-tag: pass the
# `image_tag` input with an old short-sha and GHCR's :prod is repointed at it
# server-side before the box pulls — registry and box can never disagree.
# Laptop fallback (infra deploy.sh + docker-compose.build.yml) still rsyncs
# and builds on the box if GHCR/Actions is down.
#
# workflow_dispatch-ONLY, so it is INERT until a human runs it from the Actions
# tab — merging it changes nothing in prod. There is no pull_request trigger, so
# fork PRs can neither run it nor reach the secrets.
#
# The G5 approval gate is the `production` GitHub Environment set on the deploy
# job: the job PAUSES for that environment's required reviewer (Olga) before any
# step runs. Only after approval do the deploy steps execute.
#
# Because this file is public, it contains NO secret values — only
# `${{ secrets.* }}` references (LIGHTSAIL_SSH_KEY, BOX_IP), provisioned
# out-of-band in repo settings. The key is written to a file with `printf` and is
# never echoed; GitHub also masks secret values in logs.
#
# Runtime config (.env.prod: GOOGLE_API_KEY, INTERNAL_API_SECRET, LANGFUSE_*,
# CACHE_TTL_SECONDS, CACHE_MAX_ENTRIES) lives ONLY on the box; images carry no
# secrets and env is injected by compose at run time, so the acute AI
# config-drift area is untouched by deploys.
#
# POST-MERGE RELEASE ONLY: it does not run tests and MUST NEVER trigger an eval
# (eval = real Gemini spend, founder-gated). The QA factual-grounding /
# Langfuse eval-before-merge gate stays in CI.
#
# CONCURRENCY: the group below serializes ai deploys against each other.
# Known residual gap (accepted): GitHub concurrency groups are repo-scoped,
# so an ai deploy cannot serialize against a frontend/backend deploy running
# from their repos. With a solo G5 approver the race requires approving two
# deploys simultaneously; a box-side flock is the fix if that ever changes.
#
# JUST-IN-TIME SSH: port 22 on the box is CLOSED at rest
# (storyland-infrastructure/deploy/terraform-lightsail). This workflow assumes
# the storyland-github-deploy role via OIDC (no long-lived AWS keys), opens
# port 22 for the runner's IP for the duration of the deploy, and always
# closes it afterwards. Requires the AWS_DEPLOY_ROLE_ARN repo VARIABLE.
# Mirrors the same steps in the infra repo's deploy-service.yml — keep the
# two in sync.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref of storyland-ai to deploy (default: the branch this run was dispatched from)."
        required: false
        default: ""
      image_tag:
        description: "Existing GHCR short-sha tag to redeploy WITHOUT building (rollback lever — see infra deploy/README.md; rehearse before relying on it)."
        required: false
        default: ""

concurrency:
  group: deploy-ai-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for the just-in-time SSH role
  packages: write # push the built image to GHCR

jobs:
  deploy:
    name: Deploy storyland-ai to the Lightsail box
    runs-on: ubuntu-latest
    # The G5 gate: this environment has Olga as a required reviewer, so the job
    # pauses for her approval before any step runs.
    environment: production
    steps:
      - name: Record approval
        run: echo "G5 production deploy approved — proceeding to deploy storyland-ai (ref='${{ inputs.ref || github.ref_name }}', image_tag='${{ inputs.image_tag }}')."

      # Fail-fast BEFORE any registry mutation (matches infra's step order —
      # the keep-in-sync rule): an unset role ARN must not let build+push
      # move :prod to an image the box then never pulls.
      - name: Validate JIT-SSH configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          [ -n "$AWS_DEPLOY_ROLE_ARN" ] || { echo "::error::Repo variable AWS_DEPLOY_ROLE_ARN is not set"; exit 1; }

      - name: Checkout caller repo source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image (runner-side — the box never builds)
        if: inputs.image_tag == ''
        run: |
          IMAGE="ghcr.io/o-ostrovskiy/storyland-ai"
          # Immutable per-commit tag from the CHECKED-OUT tree (a `ref` input
          # deploy tags that ref, not the triggering commit). Push ONLY the
          # sha here: :prod moves in the Publish step AFTER the stage gate —
          # otherwise a gate failure would leave the registry's :prod pointing
          # at an image just proven unbootable, fetched by every later
          # recreate/pull (a caught failure deferred into a latent outage).
          TAG="$(git rev-parse --short HEAD)"
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - name: Retag rollback image IN THE REGISTRY
        if: inputs.image_tag != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # Registry-side manifest retag (no pull, no rebuild): after this,
          # GHCR's :prod IS the rollback image, so the box's plain
          # `docker pull :prod` — and any future pull by anyone — agrees
          # with what's running. A box-local `docker tag` would leave the
          # registry pointing at the rolled-away image, and the next
          # innocent pull would silently re-land it.
          IMAGE="ghcr.io/o-ostrovskiy/storyland-ai"
          docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE:$IMAGE_TAG"

      - name: Ephemeral stage — boot the full stack from the images about to ship
        if: inputs.image_tag == ''
        run: |
          # Mirrors infra deploy-service.yml's stage gate (keep-in-sync rule):
          # compose-up the just-built ai sha image + frontend/backend :prod on
          # the runner, gate on the stack's compose-defined healthchecks
          # (the images carry no HEALTHCHECK — these mirror the prod compose's;
          # keep them in sync), tear down. The registry's :prod has NOT moved
          # yet (build pushed only the sha; Publish moves :prod after this
          # gate), so a gate failure leaves prod and registry untouched.
          # Dummy boot-only secrets, zero AI spend. Skipped (warn) while the
          # registry is still seeding; skipped on the rollback path (that sha
          # already shipped through this gate, and rollback is time-critical).
          for pkg in storyland-backend storyland-frontend; do
            if ! docker pull -q "ghcr.io/o-ostrovskiy/$pkg:prod"; then
              echo "::warning::stage skipped — ghcr.io/o-ostrovskiy/$pkg:prod not in the registry yet (pre-train-1 seeding); the stage gate activates once all three :prod images exist."
              exit 0
            fi
          done
          # LOCAL-only alias so the static compose below resolves the ai
          # service to the just-built sha image; never pushed.
          docker tag "ghcr.io/o-ostrovskiy/storyland-ai:$(git rev-parse --short HEAD)" "ghcr.io/o-ostrovskiy/storyland-ai:prod"
          cat > /tmp/docker-compose.stage.yml <<'YML'
          # Generated by deploy-ai-prod.yml's stage gate. Images only. Env
          # mirrors train-smoke.sh's proven boot set; INTERNAL_API_SECRET is
          # a non-empty dummy so the fail-closed gateway check (MYS-446)
          # passes AND stays enforced.
          services:
            # MYS-611: same engine+major as prod (postgres:16-alpine) so the
            # backend's alembic migrations validate against the PROD dialect,
            # not SQLite. Fresh volume every run — no prod data.
            db:
              image: postgres:16-alpine
              environment:
                - POSTGRES_USER=storyland
                - POSTGRES_PASSWORD=stage-dummy
                - POSTGRES_DB=storyland
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U storyland -d storyland"]
                interval: 5s
                timeout: 5s
                retries: 6
                start_period: 10s
            storyland-ai:
              image: ghcr.io/o-ostrovskiy/storyland-ai:prod
              environment:
                - GOOGLE_API_KEY=stage-dummy
                - MODEL_NAME=gemini-3.1-flash-lite-preview
                - USE_DATABASE=false
                - SESSION_MAX_EVENTS=20
                - MAX_CONTEXT_TOKENS=30000
                - WORKFLOW_TIMEOUT=600
                - AGENT_TIMEOUT=120
                - ENABLE_ADK_DEBUG=false
                - CACHE_ENABLED=true
                - CACHE_TTL_SECONDS=86400
                - CACHE_MAX_ENTRIES=500
                - CACHE_BACKEND=memory
                - CORS_ORIGINS=http://localhost:18080
                - INTERNAL_API_SECRET=stage-dummy
                - REQUIRE_GATEWAY_SECRET=true
                - LOG_LEVEL=INFO
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
                interval: 10s
                timeout: 10s
                retries: 5
                start_period: 30s
            backend:
              image: ghcr.io/o-ostrovskiy/storyland-backend:prod
              environment:
                - PORT=8090
                - UPSTREAM_URL=http://storyland-ai:8080
                - DATABASE_URL=postgresql+asyncpg://storyland:stage-dummy@db:5432/storyland
                - JWT_SECRET=stage-dummy
                - CORS_ORIGINS=http://localhost:18080
                - INTERNAL_API_SECRET=stage-dummy
                - LOG_LEVEL=INFO
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/v1/health')"]
                interval: 10s
                timeout: 10s
                retries: 5
                start_period: 30s
              depends_on:
                storyland-ai: {condition: service_healthy}
                db: {condition: service_healthy}
            frontend:
              image: ghcr.io/o-ostrovskiy/storyland-frontend:prod
              environment: ["BACKEND_URL=http://backend:8090"]
              healthcheck:
                test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 15s
              depends_on:
                backend: {condition: service_healthy}
          YML
          STAGE=(docker compose -p stage -f /tmp/docker-compose.stage.yml)
          # Timeout derivation (MYS-611 review-corrected — the first version
          # understated two ceilings). Time-to-verdict ceiling per service is
          # start_period + retries x interval:
          #   db       10 + 6x5  = 40s
          #   ai       30 + 5x10 = 80s   (parallel with db)
          #   backend  30 + 5x10 = 80s   (after max(db, ai))
          #   frontend 15 + 5x10 = 65s   (after backend)
          # Critical path = max(40, 80) + 80 + 65 = 225s. 300 gives ~75s
          # (~25%) headroom; the gate exits the moment the stack is healthy,
          # so the ceiling costs nothing on the happy path. If you tune any
          # start_period/retries/interval above, RE-DO this sum.
          if "${STAGE[@]}" up -d --wait --wait-timeout 300; then
            echo "Stage PASS: full stack healthy from the images about to ship."
            "${STAGE[@]}" ps
          else
            echo "::error::Stage FAIL — the stack built from these images cannot boot healthy; aborting before the box is touched."
            "${STAGE[@]}" ps
            "${STAGE[@]}" logs --tail 40
            "${STAGE[@]}" down -v || true
            exit 1
          fi
          "${STAGE[@]}" down -v

      - name: Publish :prod (registry-side, AFTER the gate)
        if: inputs.image_tag == ''
        run: |
          # :prod moves only now — the sha it points at has just booted
          # healthy in the stage (or the stage self-skipped during registry
          # seeding). Server-side manifest tag from the already-pushed sha —
          # same imagetools semantics as the rollback retag, so :prod is only
          # ever moved by exactly two steps, both post-verification.
          IMAGE="ghcr.io/o-ostrovskiy/storyland-ai"
          docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE:$(git rev-parse --short HEAD)"

      # SSH opens only now — the (slow) build happens with port 22 still shut.
      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Open SSH for this runner (just-in-time)
        run: |
          RUNNER_IP="$(curl -sf https://checkip.amazonaws.com)"
          # ipv6Cidrs must be explicitly empty — Lightsail defaults it to ::/0
          # when omitted (open to the whole IPv6 internet).
          aws lightsail open-instance-public-ports \
            --instance-name storyland \
            --port-info "{\"fromPort\":22,\"toPort\":22,\"protocol\":\"tcp\",\"cidrs\":[\"$RUNNER_IP/32\"],\"ipv6Cidrs\":[]}"

      - name: Set up SSH key + pinned known_hosts
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          BOX_IP: ${{ secrets.BOX_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the box host key (scanned once over the network), then strict-verify against it.
          ssh-keyscan -H "$BOX_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Pull + restart storyland-ai on the box (no build)
        env:
          BOX_IP: ${{ secrets.BOX_IP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ConnectTimeout=10"
          # The just-in-time firewall change can take a few seconds to propagate.
          for i in $(seq 1 6); do
            $SSH_CMD "ubuntu@$BOX_IP" "true" && break
            [ "$i" = 6 ] && { echo "::error::Box unreachable over SSH after JIT port opening"; exit 1; }
            sleep 5
          done
          IMAGE="ghcr.io/o-ostrovskiy/storyland-ai"
          # Sentry release = the deployed image's source short-sha. On the
          # rollback path the tag IS that sha; on the build path it comes
          # from the checked-out tree, not GITHUB_SHA. .env.release persists
          # across ALL deploys (every compose call reads it); only ai deploys
          # rewrite it — keep in sync with deploy.sh and infra's
          # deploy-service.yml (the usual two-places caveat).
          RELEASE="${IMAGE_TAG:-$(git rev-parse --short HEAD)}"
          # One pull path regardless of build vs rollback: the registry's
          # :prod is always authoritative. Needs the one-time
          # `docker login ghcr.io` with a read:packages PAT on the box
          # (see infra deploy/README.md) — images are private.
          # --wait gates this step on the ai container's OWN healthcheck —
          # the later edge poll curls the SPA, which answers 200 with the ai
          # container stopped, crash-looping, or refusing to boot on an
          # empty INTERNAL_API_SECRET (the documented four-paths trap); the
          # ai service isn't publicly exposed at all, so the box step is the
          # only place its health can gate the deploy.
          # `docker image prune -f` (dangling only) reclaims the previous
          # :prod's orphaned layers; `|| true` because cleanup must never
          # fail a deploy that worked.
          $SSH_CMD "ubuntu@$BOX_IP" \
            "cd ~/storyland/storyland-infrastructure/deploy && \
             printf 'SENTRY_RELEASE=%s\n' \"$RELEASE\" > .env.release && \
             docker pull $IMAGE:prod && \
             docker compose -f docker-compose.prod.yml --env-file .env.prod --env-file .env.release up -d --no-deps --wait storyland-ai && \
             docker compose -f docker-compose.prod.yml ps storyland-ai && \
             { docker image prune -f || true; }"

      - name: Close SSH (at-rest state)
        if: always()
        run: |
          # Runs even on failure/cancel so port 22 never lingers open.
          # Converges to exactly what terraform manages (no port-22 entry).
          aws lightsail close-instance-public-ports \
            --instance-name storyland \
            --port-info "fromPort=22,toPort=22,protocol=tcp"

      # Post-close (touches only the public site, mirrors the reusable
      # workflow's non-backend branch): don't-race-the-restart gate. A red
      # here means the site never answered after the deploy — investigate;
      # it does NOT auto-rollback.
      - name: Wait for the site to answer healthy
        run: |
          for i in $(seq 1 12); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://mystoryland.ai/ || true)"
            case "$CODE" in
              2??|3??) echo "Healthy (HTTP $CODE) after $i attempt(s)."; exit 0 ;;
            esac
            [ "$i" = 12 ] && { echo "::error::site never answered healthy after deploy"; exit 1; }
            sleep 5
          done

      - name: Prune old GHCR image versions (keep newest 15)
        # FORWARD deploys only — never on the rollback path. A rollback to a
        # sha older than the retention window would otherwise succeed, then
        # this step would delete the very version :prod now points at (prune
        # keeps the newest 15 BY DATE): the running container survives, and
        # the next recreate/pull fails on a tag that no longer exists — a
        # green rollback manufacturing a latent outage.
        if: success() && inputs.image_tag == ''
        # Retention is cleanup — it must never red a green deploy. Bounds the
        # rollback lever to ~15 deploys back; a rollback meant to persist
        # should be re-landed via ref=<old sha> (see infra deploy/README.md).
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: storyland-ai
          package-type: container
          min-versions-to-keep: 15
