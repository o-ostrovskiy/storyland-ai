name: Scheduled Evaluation

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger
    inputs:
      datasets:
        description: 'Datasets to evaluate (space-separated). Leave empty to auto-discover all datasets from evaluation/langfuse_datasets.json'
        required: false
        default: ''
      max_cases:
        description: 'Maximum cases per dataset (default: 10)'
        required: false
        default: '10'

jobs:
  scheduled-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create .env file
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > .env
          echo "USE_DATABASE=false" >> .env
          echo "LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}" >> .env
          echo "LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}" >> .env
          echo "LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}" >> .env

      - name: Run scheduled evaluations
        run: |
          # Set default parameters (used for both scheduled and manual runs)
          DEFAULT_MAX_CASES=10

          # Determine datasets argument
          # If not specified, the script will auto-discover from evaluation/langfuse_datasets.json
          DATASETS_ARG=""
          if [ -n "${{ github.event.inputs.datasets }}" ]; then
            DATASETS_ARG="--datasets ${{ github.event.inputs.datasets }}"
          fi

          # Determine max cases argument with explicit default
          MAX_CASES="${{ github.event.inputs.max_cases }}"
          if [ -z "$MAX_CASES" ]; then
            MAX_CASES="$DEFAULT_MAX_CASES"
          fi

          # Run evaluations with default parameters
          python evaluation/tools/run_scheduled_eval.py \
            --output-dir evaluation/results \
            --max-cases "$MAX_CASES" \
            $DATASETS_ARG

      - name: Generate evaluation report
        if: success()
        run: |
          python evaluation/tools/eval_dashboard.py --action report --days 30

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results-${{ github.run_number }}
          path: |
            evaluation/results/
            evaluation/trend_report.md
          retention-days: 90

      - name: Commit updated trend report
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if trend report was updated
          if [[ -n $(git status -s evaluation/trend_report.md) ]]; then
            git add evaluation/trend_report.md
            git commit -m "chore: Update evaluation trend report (automated)"
            git push
          else
            echo "No changes to trend report."
          fi

      - name: Create issue on evaluation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Scheduled Evaluation Failed',
              body: `The scheduled evaluation workflow failed on ${new Date().toISOString()}.\n\n**Run Details:**\n- Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n- Triggered by: ${{ github.event_name }}\n\nPlease check the logs and ensure:\n1. Langfuse credentials are correctly configured\n2. Google API key is valid\n3. Datasets exist in Langfuse\n\nView results: ${{ secrets.LANGFUSE_HOST }}`,
              labels: ['evaluation', 'automation', 'bug']
            });

      - name: Comment evaluation summary
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Try to read the trend report
            let reportContent = 'Evaluation completed successfully. Check artifacts for detailed results.';
            if (fs.existsSync('evaluation/trend_report.md')) {
              reportContent = fs.readFileSync('evaluation/trend_report.md', 'utf8');
              // Limit to first 2000 characters for comment
              if (reportContent.length > 2000) {
                reportContent = reportContent.substring(0, 2000) + '\n\n...(truncated)';
              }
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '✅ Scheduled Evaluation Completed',
              body: `Scheduled evaluation completed on ${new Date().toISOString()}.\n\n**Results:**\n\n${reportContent}\n\n**Full Report:** See artifacts in [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              labels: ['evaluation', 'automation']
            });
