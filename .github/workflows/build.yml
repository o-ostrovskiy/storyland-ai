name: Build

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag override (default: short commit SHA)'
        required: false
        default: ''
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: false
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ACCOUNT_ID:
        required: true
    outputs:
      image-uri:
        description: 'Full ECR image URI with SHA tag'
        value: ${{ jobs.build.outputs.image-uri }}
      image-tag:
        description: 'Short SHA tag used'
        value: ${{ jobs.build.outputs.image-tag }}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: storyland-ai

concurrency:
  group: build-storyland-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          CUSTOM_TAG="${{ inputs.image-tag }}"
          TAG="${CUSTOM_TAG:-$SHORT_SHA}"
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image-uri=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$TAG" >> $GITHUB_OUTPUT
          echo "ecr-registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
