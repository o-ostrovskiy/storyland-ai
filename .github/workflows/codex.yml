name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert google-adk pinned to the tested 1.x line
        run: |
          python -c "import importlib.metadata as m, sys; v = m.version('google-adk'); print('resolved google-adk', v); sys.exit(0 if v.split('.')[0] == '1' else 'ERROR: google-adk resolved to %s; expected the pinned 1.x major (>=1.33.0,<2)' % v)"

      - name: Create .env file for unit tests
        run: |
          echo "GOOGLE_API_KEY=test-key" > .env
          echo "USE_DATABASE=false" >> .env
          echo "SESSION_MAX_EVENTS=20" >> .env
          echo "MAX_CONTEXT_TOKENS=30000" >> .env
          echo "MODEL_NAME=gemini-2.5-flash-lite" >> .env
          echo "WORKFLOW_TIMEOUT=300" >> .env
          echo "AGENT_TIMEOUT=60" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          echo "ENABLE_ADK_DEBUG=false" >> .env

      - name: Run unit tests
        run: |
          make test
