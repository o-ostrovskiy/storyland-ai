name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies (hash-locked)
        run: |
          python -m pip install --upgrade pip
          # Pinned deps with hashes; then the local package only (--no-deps keeps
          # the resolver from re-touching the pinned tree). The editable local pkg
          # cannot itself be hash-pinned, hence the two-step install.
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Assert google-adk pinned to the tested 2.x line
        # Now validates the LOCKED resolution (strictly stronger than a live resolve).
        run: |
          python -c "import importlib.metadata as m, sys; v = m.version('google-adk'); print('resolved google-adk', v); sys.exit(0 if v.split('.')[0] == '2' else 'ERROR: google-adk resolved to %s; expected the pinned 2.x major (>=2.4.0,<3)' % v)"

      - name: Verify lockfiles are up to date
        # A pyproject dependency/cap edit without a regenerated lock is silent drift.
        # Recompile with the pinned uv version and fail if the committed lock changed.
        run: |
          pip install uv==0.11.29
          make lock
          git diff --exit-code requirements.lock requirements-dev.lock \
            || { echo "::error::Lockfile stale — run 'make lock' and commit requirements*.lock."; exit 1; }

      - name: Audit shipped dependencies (pip-audit gate)
        # Fails on any known vuln in the PROD lock. Accepted risks are ignored inline
        # WITH justification + tracking; a NEW, un-accepted vuln fails the build.
        run: |
          pip install pip-audit==2.10.1
          pip-audit --strict --require-hashes -r requirements.lock \
            --ignore-vuln PYSEC-2026-2447
            # The five starlette 0.52.1 ignores (PYSEC-2026-161/248/249/2280/2281)
            # were removed with the ADK 2.x upgrade: the lock now resolves
            # starlette>=1.3, which carries all the fixes. diskcache 2447: no
            # upstream fix. storyland-ai is an internal upstream behind the
            # gateway, not directly internet-facing, which lowers the
            # Host-header DoS exposure.

      - name: Create .env file for unit tests
        run: |
          echo "GOOGLE_API_KEY=test-key" > .env
          echo "USE_DATABASE=false" >> .env
          echo "SESSION_MAX_EVENTS=20" >> .env
          echo "MAX_CONTEXT_TOKENS=30000" >> .env
          # MYS-666: the whole gemini-2.5 line 404s "no longer available" on
          # this key (observed 2026-08-09, MYS-825) and Google retires it
          # 2026-10-16. Keep this in the same family as
          # `common/config.py::DEFAULT_MODEL_NAME`, which is what the service
          # falls back to when MODEL_NAME is unset; `test_eval_shapes.py`
          # asserts every CI injection does.
          echo "MODEL_NAME=gemini-3.1-flash-lite" >> .env
          echo "WORKFLOW_TIMEOUT=300" >> .env
          echo "AGENT_TIMEOUT=60" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          echo "ENABLE_ADK_DEBUG=false" >> .env

      - name: Run unit tests with coverage (ratchet)
        run: |
          make test-ci
