name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip unit and integration tests'
        type: boolean
        required: false
        default: false

concurrency:
  group: cicd-storyland-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit Tests
    if: ${{ !inputs.skip-tests }}
    uses: ./.github/workflows/codex.yml

  integration-tests:
    name: Integration Tests
    if: ${{ !inputs.skip-tests }}
    # MYS-440 AC-1: the VCR-replay workflow takes no secrets (it replays
    # offline on the conftest dummy key) and needs only read access.
    permissions:
      contents: read
    uses: ./.github/workflows/integration-tests.yml

# NOTE: This pipeline is a compile/test check only — it does NOT deploy. The app
# runs on a single Lightsail box (self-hosted, see storyland-infrastructure/deploy/);
# the old ECR build + ECS deploy targets were decommissioned and their dormant
# build.yml / deploy.yml have been removed. Production releases run through the
# G5-gated `deploy-ai-prod.yml` workflow (workflow_dispatch + `production`
# environment approval), which calls the reusable SSH-deploy workflow in
# storyland-infrastructure. The manual fallback is still
#   KEY=~/.ssh/storyland.pem storyland-infrastructure/deploy/deploy.sh storyland-ai
