name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip unit and integration tests'
        type: boolean
        required: false
        default: false

concurrency:
  group: cicd-storyland-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit Tests
    if: ${{ !inputs.skip-tests }}
    uses: ./.github/workflows/codex.yml

  integration-tests:
    name: Integration Tests
    if: ${{ !inputs.skip-tests }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/integration-tests.yml
    secrets:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}

# NOTE: Auto build+deploy removed. The app now runs on a single Lightsail box
# (self-hosted, see storyland-infrastructure/deploy/). The old ECR build + ECS
# deploy targets were decommissioned. Deploy with:
#   KEY=~/.ssh/storyland.pem storyland-infrastructure/deploy/deploy.sh storyland-ai
# The dormant build.yml / deploy.yml in this folder target the removed AWS infra
# and should not be dispatched until reworked for the box.
